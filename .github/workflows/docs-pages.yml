name: Docs
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run docs:check
      - run: npm run docs:build -- --base /PatterStage/
      - run: node scripts/docs/check-publish-artifact.mjs site
      - uses: actions/upload-pages-artifact@v5
        with: { path: site, include-hidden-files: true }
      - id: deploy
        uses: actions/deploy-pages@v5
