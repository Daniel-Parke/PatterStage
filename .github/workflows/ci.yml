name: CI

# Required for actions/checkout on pull_request merge refs (avoids intermittent auth failures).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Parallel jobs: unit+build per OS, shell helpers test (bash only), and E2E on Ubuntu only.
jobs:
  shell-custom-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        id: checkout1
        continue-on-error: true
        with:
          token: ${{ github.token }}
      - name: Checkout repository (retry)
        if: steps.checkout1.outcome != 'success'
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - name: Hermes profile helpers + dotenv (isolated /tmp HERMES_HOME)
        run: bash tests/scripts/run-shell-custom-tests.sh

  build-test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        id: checkout1
        continue-on-error: true
        with:
          token: ${{ github.token }}
      - name: Checkout repository (retry)
        if: steps.checkout1.outcome != 'success'
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (with cache reset retry)
        run: |
          npm ci || (npm cache clean --force && npm ci)
      - name: Run database migrations
        run: npm run prebuild
      - name: ESLint
        run: npm run lint
      - uses: ./.github/actions/forbid-hermes-paths-in-api
      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Next.js production build
        run: npm run build
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov-report
          if-no-files-found: ignore

  build-test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        id: checkout1
        continue-on-error: true
        with:
          token: ${{ github.token }}
      - name: Checkout repository (retry)
        if: steps.checkout1.outcome != 'success'
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (with cache reset retry)
        run: |
          npm ci || (npm cache clean --force && npm ci)
      - name: Run database migrations
        run: npm run prebuild
      - name: ESLint
        run: npm run lint
      - uses: ./.github/actions/forbid-hermes-paths-in-api
      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Warmup Google Fonts cache
        # Macos runners intermittently fail to reach fonts.googleapis.com
        # during `next build` (Turbopack fetches Google Fonts at build time
        # and treats the failure as a hard error). The unit-test step above
        # also runs `next build` for the test renderer but doesn't touch the
        # 6 fonts used by `src/app/layout.tsx` + `src/app/recroom/story-weaver/layout.tsx`.
        # This warmup pre-fetches the same 6 fonts with retry so the
        # production build's font fetch is either cached or surfaces a clear
        # transient-network error rather than a Turbopack "Failed to fetch"
        # cascade. Sourced from the same font URLs the 2 layout files use.
        run: |
          set +e
          FONTS=(
            "https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
            "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap"
            "https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&display=swap"
            "https://fonts.googleapis.com/css2?family=Literata:wght@200..900&display=swap"
            "https://fonts.googleapis.com/css2?family=Lora:wght@400..700&display=swap"
            "https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap"
          )
          for url in "${FONTS[@]}"; do
            for attempt in 1 2 3; do
              if curl -fsS --max-time 30 -o /dev/null "$url"; then
                echo "OK ($attempt): $url"
                break
              fi
              echo "retry $attempt failed: $url"
              sleep 2
            done
          done
      - name: Next.js production build (with retry)
        # 2-attempt retry on transient network errors. `next build` with
        # Turbopack is the only step that fails on this branch (the
        # sibling `build-test-ubuntu` job builds the identical code on the
        # same commit without issues — the only diff is the macOS runner's
        # egress to fonts.googleapis.com). A single retry catches the flake
        # without hiding a real build failure.
        run: |
          npm run build || {
            echo "::warning::next build failed on first attempt, retrying once after 5s"
            sleep 5
            npm run build
          }

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        id: checkout1
        continue-on-error: true
        with:
          token: ${{ github.token }}
      - name: Checkout repository (retry)
        if: steps.checkout1.outcome != 'success'
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (with cache reset retry)
        run: |
          npm ci || (npm cache clean --force && npm ci)
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run database migrations
        run: npm run prebuild
      - name: Next.js production build
        run: npm run build
      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: true
          PORT: "3000"
          PLAYWRIGHT_SMOKE: "1"

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        id: checkout1
        continue-on-error: true
        with:
          token: ${{ github.token }}
      - name: Checkout repository (retry)
        if: steps.checkout1.outcome != 'success'
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - name: Build production Docker image
        run: docker build -f Dockerfile -t control-hub:ci .
      - name: Dashboard deploy API — restart smoke (Docker)
        run: bash tests/scripts/docker-deploy-api-smoke.sh
        env:
          CH_DOCKER_TEST_IMAGE: control-hub:ci
          CH_DOCKER_TEST_PORT: "42090"

  # Validates the runtime adapter against the REAL Hermes Agent (official image)
  # pointed at a deterministic mock LLM. Heavy (~5GB image pull + agent runtime),
  # so it runs on the dev->prod surface (push to dev/main) + manual dispatch, not
  # on every PR. Per-PR coverage comes from the fast mock-hermes smoke + the unit
  # contract tests in build-test-*.
  real-hermes-integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Real-Hermes integration (contract + full-stack smoke)
        run: npm run test:e2e-hermes
